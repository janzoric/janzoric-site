# Builds the site and publishes it to GitHub Pages on every push to main
# (including every "Save" in the CMS). Takes about 1–3 minutes.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - id: pages
        uses: actions/configure-pages@v5
      # Keep already-optimized photos between builds so only new ones are processed.
      - uses: actions/cache@v4
        with:
          path: |
            .cache
            _site/img
          key: images-${{ hashFiles('src/photos/**') }}
          restore-keys: images-
      - run: npm ci
      # On a temporary username.github.io/repo/ address links need the /repo/ prefix;
      # with a custom domain base_path is empty.
      - run: npm run build
        env:
          PATH_PREFIX: ${{ steps.pages.outputs.base_path }}/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
