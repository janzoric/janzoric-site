# Pogosta vprašanja na strani IZBIRA. Google jih lahko pokaže tudi neposredno v rezultatih iskanja.
vprasanja:
  - vprasanje: Ali fotografiraš tudi izven Slovenije?
    odgovor: Ja. Po celi Sloveniji je pot že vključena v ceno, brez dodatkov. Izven Slovenije potne stroške obračunam po dejanskih stroških.

  - vprasanje: Kdaj dobiva fotografije?
    odgovor: Potrudim se čim prej, najkasneje pa v 30 dneh po dnevu poroke.

  - vprasanje: Ali dobiva tudi neobdelane fotografije?
    odgovor: Ne. Tako kot chef ne postreže neskuhanih sestavin, tudi jaz ne dostavim nedokončanega izdelka. Ampak brez skrbi – če je fotka dobra, jo bosta dobila. Zavržem predvsem meglene, neostre in tiste, kjer ima kdo zaprte oči.

  - vprasanje: Koliko je akontacija?
    odgovor: 50 % zneska. S plačilom akontacije je vajin datum rezerviran.

  - vprasanje: Kaj pa, če zboliš?
    odgovor: Vrnem vama celoten znesek ali pa najdem ustrezno zamenjavo.

  - vprasanje: Ali fotografiraš tudi predporočna fotografiranja?
    odgovor: Po dogovoru ja – in celo priporočam jih. Tako se že prej malo spoznamo, vidva se navadita na fotografiranje in poročni dan potem teče bolj gladko. Cena je odvisna od lokacije in dolžine fotografiranja, zato se dogovorimo posebej.
